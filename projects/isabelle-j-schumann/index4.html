<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Isabelle J Schumann</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="navbar">
            <div id="navbar-column">
                <a href="index.html">ISchumann Graphics</a>
                <a href="index.html">Home</a>
                <a href="index2.html">Gallery</a>
                <a href="index3.html">About Me</a>
            </div>
        </div>            
        </div>
        <div id="layout-2">
            <header>
                <h1>Contact Me</h1>
                <p>
                    Got a question? 
                    I'd love to hear from you. 
                    Send me a message and I'll
                    respond as soon as possible.
                </p>
            </header>
            <main>
                    <form 
                    method="POST" 
                    action="https://getform.io/f/599c2b13-fd57-44e4-95a1-2c722b05c5e8"
                >
                    <div>
                        <label for="services_id">
                            What can I help you with?
                        </label>
                        <select id="services_id" name="service_selection">
                            <option 
                                id="default_option" 
                                value="none" 
                                disabled
                                selected
                            >
                                Select what I can help you with
                            </option>
                            <option value="my artwork">
                                My Artwork
                            </option>
                            <option value="logo & brand designs">
                                Logo & brand Designs
                            </option>
                            <option value="illustrations & animations">
                                Illustrations & Animations
                            </option>
                        </select>
                    </div>
                    <div>
                        <label for="name_id">Name</label>
                        <input 
                            type="text" 
                            id="name_id" 
                            name="name" 
                            required 
                            minlength="2"
                            placeholder="E.g. John Smith"
                        >
                    </div>
                    <div>
                        <label for="email_id">Email</label>
                        <input 
                            type="email" 
                            id="email_id" 
                            name="email"
                            required
                            placeholder="E.g. jane.doe@gmail.com"
                        >
                    </div>
                    <div>
                        <label for="message_id">Message</label>
                        <textarea 
                            id="message_id" 
                            name="message"
                            placeholder="I would like you to..."></textarea>
                    </div>
                    <div>
                        <input type="submit" value="Send">
                    </div>
                </form>
            </main>
        </div>  
        <div id="footer">
            <div id="footer-column">
                <a href="index.html">ISchumann Graphics</a>
                <a href="index4.html">Contact Me</a>
                <a href="index5.html">My Socials</a>
            </div>
        </div>
    </body>
</html>
